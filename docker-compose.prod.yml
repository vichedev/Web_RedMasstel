# ───────────────────────────────────────────────────────────────────
#  Red MaasTel — Stack de producción (docker compose)
# ───────────────────────────────────────────────────────────────────
#  Servicios:
#    • postgres : base de datos (no expuesta al exterior)
#    • backend  : Nest + SPA empaquetados en la misma imagen
#    • nginx    : reverse proxy 80/443 (TLS opcional)
#
#  Vars sensibles → .env.deploy (generado por scripts/deploy.sh).
#  Para arrancar a mano:
#    docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d
# ───────────────────────────────────────────────────────────────────
name: redmaastel

services:
  postgres:
    image: postgres:16-alpine
    container_name: redmaastel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [redmaastel_net]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: red-maastel-api:latest
    container_name: redmaastel_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d

      COOKIE_NAME: ws_session
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}

      CORS_ORIGIN: ${CORS_ORIGIN}

      BCRYPT_SALT_ROUNDS: "12"
      THROTTLE_TTL_MS: "60000"
      THROTTLE_LIMIT: "120"

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}

      UPLOAD_DEST: /app/uploads
      UPLOAD_MAX_SIZE: "26214400"
    volumes:
      - redmaastel_uploads:/app/uploads
    networks: [redmaastel_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: redmaastel_nginx
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [redmaastel_net]

volumes:
  postgres_data:
  redmaastel_uploads:
  certbot_certs:
  certbot_www:

networks:
  redmaastel_net:
    driver: bridge
